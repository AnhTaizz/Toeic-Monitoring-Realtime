spring.application.name=toeic-server
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:toeic}
spring.datasource.username=${DB_USER:toeic}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

toeic.seed.password=${TOEIC_SEED_PASSWORD:ChangeMe123!}

server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
