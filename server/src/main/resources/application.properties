spring.application.name=toeic-server
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:toeic}
spring.datasource.username=${DB_USER:toeic}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

toeic.seed.password=${TOEIC_SEED_PASSWORD:ChangeMe123!}

server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO

# Raw WebSocket transport limits; no STOMP/SockJS/broker.
toeic.ws.max-message-bytes=${WS_MAX_MESSAGE_BYTES:65536}
toeic.ws.send-timeout-ms=${WS_SEND_TIMEOUT_MS:5000}
toeic.ws.send-buffer-bytes=${WS_SEND_BUFFER_BYTES:65536}

# Presence is communication evidence, not proof of complete process observation.
toeic.presence.timeout-ms=${MONITORING_TIMEOUT_MS:6000}
toeic.presence.scan-interval-ms=${MONITORING_TIMEOUT_SCAN_MS:500}
toeic.presence.max-attempts=${MONITORING_PRESENCE_MAX_ATTEMPTS:4096}
toeic.presence.max-associations-per-attempt=${MONITORING_ASSOCIATIONS_PER_ATTEMPT:8}

# Full snapshot RAM state; heartbeat freshness is a separate fact.
toeic.state.stale-ms=${MONITORING_STATE_STALE_MS:6000}
toeic.state.ttl-ms=${MONITORING_STATE_TTL_MS:300000}
toeic.state.scan-ms=${MONITORING_STATE_SCAN_MS:500}
toeic.state.max-attempts=${MONITORING_STATE_MAX_ATTEMPTS:4096}
