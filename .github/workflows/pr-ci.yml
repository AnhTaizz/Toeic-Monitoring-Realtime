name: PR CI

on:
  pull_request:
  # Verify exact main HEAD as well as stabilization branches.
  push:
    branches: ['main', 'stabilize/**']

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests (Java 21)
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Clean test and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validate LAN kit scripts (MOCK files, no network)
        shell: powershell
        run: .\scripts\lan-t3c4\Test-T3C4LanKit.ps1 -OutputDirectory target/ci-lan-kit -JavaHome $env:JAVA_HOME
